<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="NetCDF dimension order feeds the ingest recipe, whose gridOrder sets storage order and whose tiling follows it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <text x="40" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">From file to stored tiles</text>
  <text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal">Which part of the recipe controls what</text>
  <rect x="40.0" y="86.0" width="170.0" height="118.0" fill="#dbe9f4" stroke="#2f6f9f" stroke-width="1.6"/>
  <text x="52" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">NetCDF file</text>
  <text x="52" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">dimension order</text>
  <text x="52" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">as ncdump prints it</text>
  <text x="52" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">time, model, Y, X</text>
  <rect x="295.0" y="86.0" width="170.0" height="118.0" fill="#fbeedb" stroke="#b87333" stroke-width="1.6"/>
  <text x="307" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">Ingest recipe</text>
  <text x="307" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">gridOrder → storage order</text>
  <text x="307" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">crs → catalogue order</text>
  <text x="307" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">tiling → tile shape</text>
  <rect x="550.0" y="86.0" width="170.0" height="118.0" fill="#dcefe5" stroke="#2e7d5b" stroke-width="1.6"/>
  <text x="562" y="110" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">Stored tiles</text>
  <text x="562" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">shape follows gridOrder,</text>
  <text x="562" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#67727e" text-anchor="start" font-weight="normal">never the crs order</text>
  <line x1="215.0" y1="145.0" x2="288.0" y2="145.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="470.0" y1="145.0" x2="543.0" y2="145.0" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="40" y="240" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">The tiling bracket is positional: its Nth entry is the Nth axis in gridOrder,</text>
  <text x="40" y="258" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">which is usually NOT the order DescribeCoverage reports back to clients.</text>
  <text x="40" y="282" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal" font-style="italic">Getting this pairing wrong attaches every per-axis decision to the wrong axis.</text>
</svg>
