  <text x="40" y="354.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#67727e" text-anchor="start" font-weight="normal">one x/y needs the whole stack</text>
  <text x="430" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="600">Narrow tiles, full depth in time</text>
  <rect x="430.0" y="100.0" width="41.7" height="210.0" fill="#f4f6f8" stroke="#c6cdd5" stroke-width="1"/>
