  </defs>
  <text x="40" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">The same array, tiled two ways</text>
  <text x="40" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal">What one point's full time series has to read</text>
