<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" width="780" height="500" role="img" aria-label="A 460 by 442 array under a 4 by 4 grid of 128 by 128 tiles, covering 512 by 512; the margin beyond the data holds nothing." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="780" height="500" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>
  <text x="74" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="600">One coverage, drawn to scale</text>
  <text x="74" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal">era5_4km_elevation — 460 × 442 cells, tiled 128 × 128</text>
  <rect x="74.0" y="104.0" width="330.0" height="330.0" fill="#f7dedb" stroke="none" stroke-width="1"/>
  <rect x="74.0" y="104.0" width="284.9" height="296.5" fill="#dbe9f4" stroke="none" stroke-width="1"/>
  <line x1="74.0" y1="104.0" x2="74.0" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="156.5" y1="104.0" x2="156.5" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="239.0" y1="104.0" x2="239.0" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="321.5" y1="104.0" x2="321.5" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="404.0" y1="104.0" x2="404.0" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="74.0" y1="104.0" x2="404.0" y2="104.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="74.0" y1="186.5" x2="404.0" y2="186.5" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="74.0" y1="269.0" x2="404.0" y2="269.0" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="74.0" y1="351.5" x2="404.0" y2="351.5" stroke="#c6cdd5" stroke-width="1"/>
  <line x1="74.0" y1="434.0" x2="404.0" y2="434.0" stroke="#c6cdd5" stroke-width="1"/>
  <rect x="74.0" y="104.0" width="284.9" height="296.5" fill="none" stroke="#2f6f9f" stroke-width="2"/>
  <rect x="74.0" y="104.0" width="330.0" height="330.0" fill="none" stroke="#b03a2e" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="430.0" y="118.0" width="13.0" height="13.0" fill="#dbe9f4" stroke="#2f6f9f" stroke-width="1.4"/>
  <text x="451.0" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">real data — 203,320 cells</text>
  <rect x="430.0" y="144.0" width="13.0" height="13.0" fill="#f7dedb" stroke="#b03a2e" stroke-width="1.4"/>
  <text x="451.0" y="155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">stored, holds nothing — 58,824</text>
  <text x="430.0" y="186" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal">The grid has to cover the array,</text>
  <text x="430.0" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal">so it overruns both edges:</text>
  <text x="430.0" y="229" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">442 ÷ 128 = 3.45  →  4 tiles = 512</text>
  <text x="430.0" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">460 ÷ 128 = 3.59  →  4 tiles = 512</text>
  <text x="430.0" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">16 tiles cover 262,144 cells</text>
  <text x="430.0" y="297" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="normal">to hold 203,320 of data.</text>
  <text x="430.0" y="329" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#b03a2e" text-anchor="start" font-weight="600">22% of every tile read is dead.</text>
  <line x1="358.9" y1="447.0" x2="404.0" y2="447.0" stroke="#b03a2e" stroke-width="1.4"/>
  <text x="381.44140625" y="463.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#b03a2e" text-anchor="middle" font-weight="normal">70</text>
  <line x1="414.0" y1="400.5" x2="414.0" y2="434.0" stroke="#b03a2e" stroke-width="1.4"/>
  <text x="419.0" y="421.2421875" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#b03a2e" text-anchor="start" font-weight="normal">52</text>
  <text x="74" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#67727e" text-anchor="start" font-weight="normal">X →</text>
  <text x="50" y="269" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#67727e" text-anchor="middle" transform="rotate(-90 50 269)">Y</text>
  <text x="74" y="482" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67727e" text-anchor="start" font-weight="normal" font-style="italic">Padding is read on every touch of that tile, but compresses away on disk — it costs I/O, not bytes.</text>
</svg>
