<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="450" fill="#ffffff"/>

  <text x="40" y="34" font-size="17" font-weight="600" fill="#1a1a1a">The same tile, stored several times</text>
  <text x="40" y="56" font-size="13" fill="#5a5a5a">Both arrays hold identical data and declare a correct tiling. One was ingested once; the other was re-run.</text>

  <!-- ================= LEFT: clean ================= -->
  <text x="40" y="96" font-size="13" font-weight="600" fill="#1a1a1a">Ingested once</text>
  <text x="40" y="114" font-size="11.5" fill="#6a6a6a">era5_4km_daily_t2_mean</text>

  <g>
    <rect x="40"  y="130" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="110" y="130" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="180" y="130" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="250" y="130" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="40"  y="184" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="110" y="184" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="180" y="184" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
    <rect x="250" y="184" width="62" height="46" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.4"/>
  </g>
  <text x="40" y="252" font-size="11.5" fill="#4a4a4a">4,678 tiles &#183; 4,678 unique domains</text>
  <text x="40" y="270" font-size="11.5" font-weight="600" fill="#2e6b3e">1 copy of every tile &#8594; 1.00&#215;</text>

  <!-- divider -->
  <line x1="450" y1="86" x2="450" y2="288" stroke="#e0e0e0" stroke-width="1"/>

  <!-- ================= RIGHT: duplicated ================= -->
  <text x="490" y="96" font-size="13" font-weight="600" fill="#1a1a1a">Recipe re-run against the existing coverage</text>
  <text x="490" y="114" font-size="11.5" fill="#6a6a6a">cmip6_fwi</text>

  <g>
    <!-- each tile drawn as a stack of offset identical copies -->
    <g>
      <rect x="502" y="142" width="62" height="46" fill="#f6dcdc" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="497" y="137" width="62" height="46" fill="#f2cfcf" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="492" y="132" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="487" y="127" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="577" y="137" width="62" height="46" fill="#f2cfcf" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="572" y="132" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="567" y="127" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="647" y="132" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="642" y="127" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="717" y="127" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>

    <g>
      <rect x="502" y="196" width="62" height="46" fill="#f6dcdc" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="497" y="191" width="62" height="46" fill="#f2cfcf" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="492" y="186" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="487" y="181" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="572" y="186" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="567" y="181" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="647" y="186" width="62" height="46" fill="#eec2c2" stroke="#b5636a" stroke-width="1.2"/>
      <rect x="642" y="181" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
    <g>
      <rect x="717" y="181" width="62" height="46" fill="#e9b4b4" stroke="#a3535a" stroke-width="1.5"/>
    </g>
  </g>

  <text x="487" y="262" font-size="11.5" fill="#4a4a4a">266,724 tiles &#183; 101,745 unique domains</text>
  <text x="487" y="280" font-size="11.5" font-weight="600" fill="#a3535a">up to 8 copies of one tile &#8594; 3.38&#215;</text>

  <!-- callout: identical domains -->
  <rect x="487" y="298" width="373" height="52" fill="#fbf4f4" stroke="#e2c9c9" stroke-width="1" rx="3"/>
  <text x="499" y="316" font-size="10.5" fill="#6a6a6a">every tile holding cell (model 2, t 100, lat 10, lon 10):</text>
  <text x="499" y="334" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8c3f47">[1:3,0:25679,10:11,10:11] &#215; 4 &#8212; byte-identical</text>

  <!-- ================= BOTTOM BAR ================= -->
  <defs>
    <pattern id="dup" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#f4e0e0"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#c98a90" stroke-width="2.2"/>
    </pattern>
  </defs>

  <text x="40" y="330" font-size="12" font-weight="600" fill="#1a1a1a">cmip6_fwi on disk</text>

  <rect x="40" y="344" width="236" height="30" fill="#dbe7f3" stroke="#4a7ba7" stroke-width="1.3"/>
  <rect x="276" y="344" width="168" height="30" fill="url(#dup)" stroke="#b5636a" stroke-width="1.3"/>

  <text x="46"  y="364" font-size="11.5" font-weight="600" fill="#2b5170">52.0 GB of data</text>
  <text x="282" y="364" font-size="11.5" font-weight="600" fill="#8c3f47">123.9 GB of duplicates</text>

  <text x="40" y="398" font-size="11.5" fill="#4a4a4a">The unique tile domains cover the array <tspan font-weight="600">exactly</tspan> &#8212; 52.0 GB against 52.0 GB, to the byte. The tiling is</text>
  <text x="40" y="416" font-size="11.5" fill="#4a4a4a">correct. Bytes on disk &#247; bytes the tiles cover is 1.00&#215;. All of the excess is copies.</text>
  <text x="40" y="436" font-size="11.5" font-weight="600" fill="#2e6b3e">Fix: re-ingest into a fresh collection. The recipe needs no changes.</text>
</svg>
